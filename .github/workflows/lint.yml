# Undefined variables, caught before they reach a dispatcher.
#
# This exists because /api/admin/dispatch/sheet answered every .xlsx and BOL
# upload with "s is not defined" for days: a free variable in an ES module,
# invisible to a codebase with no TypeScript and no linter. Next 16 removed
# `next lint` and no longer runs ESLint during `next build`, so nothing in the
# deploy path looks at this — it has to be its own job.
#
# It runs on pull requests and on main, and NOT as part of the Vercel build.
# That is deliberate: a lint failure must be able to stop a merge, and must
# never be able to stop a deploy.
name: Lint & test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-undef:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # ESLint is deliberately NOT a devDependency. Adding one means changing
      # package-lock.json too, and a lockfile out of step with package.json
      # makes `npm ci` fail outright — which is what Vercel builds with.
      # eslint.config.mjs is self-contained,
      # so eslint on its own is the entire toolchain and the app's own
      # dependencies never need installing to run this.
      - name: Check for undefined variables
        run: npx --yes eslint@9 .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No `npm ci`. The harness in test/_harness.mjs has no dependencies, on
      # purpose and for the same reason eslint has none here: a devDependency
      # means a package-lock.json change, and a lockfile out of step with
      # package.json makes `npm ci` fail outright — which is what Vercel builds
      # with. A test must never be able to break a deploy.
      #
      # Phase 1 replaces this with a real runner (Vitest + PGlite) so the money
      # code can be tested against an actual Postgres. At that point this job
      # grows an install step and these two lines go away.
      - name: Run tests
        run: npm test
